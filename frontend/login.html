<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Apuestas</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <h1>Iniciar sesión</h1>
  <form id="formLogin">
    <label>Usuario: <input type="text" id="usuario" required></label><br>
    <label>Contraseña: <input type="password" id="password" required></label><br>
    <button type="submit">Entrar</button>
  </form>
  <p id="mensaje"></p>
  <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>

  <script src="js/config.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        usuario: document.getElementById('usuario').value,
        password: document.getElementById('password').value
      };
      const res = await fetch(`${API.usuarios}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        sessionStorage.setItem('usuario', JSON.stringify(data));
        location.href = 'index.html';
      } else {
        document.getElementById('mensaje').textContent = data.error || 'Error al iniciar sesión';
      }
    });
  </script>
</body>
</html>
