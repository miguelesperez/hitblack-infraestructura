<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - Apuestas</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <h1>Crear cuenta</h1>
  <form id="formRegistro">
    <label>Nombre: <input type="text" id="nombre" required></label><br>
    <label>Email: <input type="email" id="email" required></label><br>
    <label>Usuario: <input type="text" id="usuario" required></label><br>
    <label>Contraseña: <input type="password" id="password" required></label><br>
    <button type="submit">Registrarme</button>
  </form>
  <p id="mensaje"></p>
  <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

  <script src="js/config.js"></script>
  <script>
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        usuario: document.getElementById('usuario').value,
        password: document.getElementById('password').value
      };
      const res = await fetch(API.usuarios, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('mensaje').textContent = 'Cuenta creada, ya puedes iniciar sesión.';
      } else {
        document.getElementById('mensaje').textContent = data.error || 'Error al registrar';
      }
    });
  </script>
</body>
</html>
