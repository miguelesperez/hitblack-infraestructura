# Despliegue en Docker Swarm:
#   docker compose build
#   docker swarm init            (una sola vez)
#   docker stack deploy -c docker-stack.yml hitblack
# Escalar:  docker service scale hitblack_apuestas=5
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    command: --max_connections=500
    ports: ["3306:3306"]   # el job de Spark escribe aquí los reportes
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    configs:
      - { source: init_usuarios, target: /docker-entrypoint-initdb.d/01-usuarios.sql }
      - { source: init_partidos, target: /docker-entrypoint-initdb.d/02-partidos.sql }
      - { source: init_apuestas, target: /docker-entrypoint-initdb.d/03-apuestas.sql }
      - { source: init_seed, target: /docker-entrypoint-initdb.d/04-seed.sql }
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # los datos viven en un volumen local
    networks: [hitblack]

  usuarios:
    image: hitblack/usuarios:latest
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: usuarios_db
    ports: ["3002:3002"]
    deploy:
      replicas: ${REPLICAS:-3}
      restart_policy: { condition: any, delay: 3s }
    networks: [hitblack]

  partidos:
    image: hitblack/partidos:latest
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: partidos_db
      APUESTAS_SERVICE_URL: http://apuestas:3003
    ports: ["3001:3001"]
    deploy:
      replicas: ${REPLICAS:-3}
      restart_policy: { condition: any, delay: 3s }
    networks: [hitblack]

  apuestas:
    image: hitblack/apuestas:latest
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: apuestas_db
      PARTIDOS_SERVICE_URL: http://partidos:3001
      USUARIOS_SERVICE_URL: http://usuarios:3002
    ports: ["3003:3003"]
    deploy:
      replicas: ${REPLICAS:-3}
      restart_policy: { condition: any, delay: 3s }
    networks: [hitblack]

  reportes:
    image: hitblack/reportes:latest
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: reportes_db
    ports: ["3004:3004"]
    deploy:
      replicas: ${REPLICAS:-3}
      restart_policy: { condition: any, delay: 3s }
    networks: [hitblack]

  frontend:
    image: hitblack/frontend:latest
    ports: ["8080:80"]
    deploy:
      replicas: 1
    networks: [hitblack]

configs:
  init_usuarios: { file: ./usuarios/schema.sql }
  init_partidos: { file: ./partidos/schema.sql }
  init_apuestas: { file: ./apuestas/schema.sql }
  init_seed: { file: ./db-init/04-seed.sql }

volumes:
  mysql_data:

networks:
  hitblack:
    driver: overlay
