services:
  mysql:
    image: mysql:8.0
    command: --max_connections=500
    ports: ["3306:3306"]   # el job de Spark (en otra máquina) escribe aquí los reportes
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      # Los scripts se ejecutan en orden alfabético la primera vez que arranca MySQL
      - ./usuarios/schema.sql:/docker-entrypoint-initdb.d/01-usuarios.sql:ro
      - ./partidos/schema.sql:/docker-entrypoint-initdb.d/02-partidos.sql:ro
      - ./apuestas/schema.sql:/docker-entrypoint-initdb.d/03-apuestas.sql:ro
      - ./db-init/04-seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [hitblack]

  usuarios:
    build: ./usuarios
    image: hitblack/usuarios:latest
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: usuarios_db
    ports: ["3002:3002"]
    depends_on:
      mysql: { condition: service_healthy }
    networks: [hitblack]

  partidos:
    build: ./partidos
    image: hitblack/partidos:latest
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: partidos_db
      APUESTAS_SERVICE_URL: http://apuestas:3003
    ports: ["3001:3001"]
    depends_on:
      mysql: { condition: service_healthy }
    networks: [hitblack]

  apuestas:
    build: ./apuestas
    image: hitblack/apuestas:latest
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: apuestas_db
      PARTIDOS_SERVICE_URL: http://partidos:3001
      USUARIOS_SERVICE_URL: http://usuarios:3002
    ports: ["3003:3003"]
    depends_on:
      mysql: { condition: service_healthy }
      partidos: { condition: service_started }
      usuarios: { condition: service_started }
    networks: [hitblack]

  reportes:
    build: ./reportes
    image: hitblack/reportes:latest
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hitblack_root_2026}
      DB_NAME: reportes_db
    ports: ["3004:3004"]
    depends_on:
      mysql: { condition: service_healthy }
    networks: [hitblack]

  frontend:
    build: ./frontend
    image: hitblack/frontend:latest
    ports: ["8080:80"]
    depends_on: [partidos, usuarios, apuestas, reportes]
    networks: [hitblack]

volumes:
  mysql_data:

networks:
  hitblack:
